<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </radialGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b85c38"/>
      <stop offset="100%" stop-color="#8d6e63"/>
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" stroke="#b85c38" stroke-width="3"/>

  <!-- 身体 -->
  <ellipse cx="100" cy="115" rx="35" ry="30" fill="url(#bird)" opacity="0.9"/>

  <!-- 头部 -->
  <circle cx="100" cy="75" r="22" fill="#c46a48" opacity="0.95"/>

  <!-- 眼睛 -->
  <circle cx="108" cy="70" r="6" fill="white"/>
  <circle cx="110" cy="69" r="3.5" fill="#2d1b0e"/>
  <circle cx="111" cy="68" r="1.2" fill="white"/>

  <!-- 嘴巴 -->
  <polygon points="125,74 145,68 125,78" fill="#e8a87c" stroke="#b85c38" stroke-width="1"/>

  <!-- 翅膀 -->
  <ellipse cx="75" cy="110" rx="20" ry="12" fill="#a65332" opacity="0.8" transform="rotate(-15, 75, 110)"/>

  <!-- 尾巴 -->
  <polygon points="65,115 40,100 45,120 38,130 65,125" fill="#8d6e63" opacity="0.7"/>

  <!-- 脚 -->
  <line x1="90" y1="140" x2="85" y2="165" stroke="#b85c38" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="140" x2="115" y2="165" stroke="#b85c38" stroke-width="3" stroke-linecap="round"/>

  <!-- 灯泡 -->
  <circle cx="85" cy="50" r="10" fill="#f5e6d3" stroke="#b85c38" stroke-width="1.5" opacity="0.9"/>
  <line x1="78" y1="58" x2="75" y2="64" stroke="#b85c38" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="85" y1="60" x2="85" y2="67" stroke="#b85c38" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="92" y1="58" x2="95" y2="64" stroke="#b85c38" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 数学符号 -->
  <text x="150" y="55" font-size="18" fill="#b85c38" opacity="0.6" font-family="serif" font-style="italic">π</text>
  <text x="155" y="80" font-size="16" fill="#b85c38" opacity="0.5" font-family="serif" font-style="italic">Σ</text>
  <text x="152" y="105" font-size="14" fill="#b85c38" opacity="0.4" font-family="serif" font-style="italic">∫</text>
</svg>
